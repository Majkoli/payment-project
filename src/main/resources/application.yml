spring:
  application:
    name: payment-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

psp:
  webhook:
    secret: test_hmac_secret_key_123
  base-url: http://localhost:8089
  connect-timeout: 2s
  read-timeout: 5s

idempotency:
  ttl: 24h                 # how long a completed response is replayable
  in-progress-timeout: 5m  # lease after which a stuck IN_PROGRESS key can be reclaimed

reconciliation:
  cron: "0 */5 * * * *"    # every 5 minutes; "-" disables the worker
  stale-after: 15m         # PENDING charges older than this are reconciled against the PSP
